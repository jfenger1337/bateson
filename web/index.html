<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FCFCFB" />
    <!-- Light or dark before the first paint: the setting's copy in localStorage, else the system (src/lib/theme.ts). -->
    <script>
      (function () {
        var t = 'system';
        try { t = localStorage.getItem('bateson:theme') || t; } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').content = '#141414';
      })();
    </script>
    <title>bateson</title>
    <!-- Installable as an app of its own (in Edge or Chrome: Install), with its own window and taskbar icon. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/fonts/schibstedgrotesk-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/newsreader-normal.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The favicon: bateson's mark in pixels on the highlighter, the same as on bateson.app. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
