<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FCFCFB" />
    <!-- Full or reduced motion before the first paint, so the splash knows (src/lib/motion.ts). -->
    <script>
      (function () {
        var m = 'system';
        try { m = localStorage.getItem('bateson:motion') || m; } catch (e) {}
        if (m !== 'full' && m !== 'reduced') m = matchMedia('(prefers-reduced-motion: reduce)').matches ? 'reduced' : 'full';
        document.documentElement.dataset.motion = m;
      })();
    </script>
    <!-- Light or dark before the first paint: the setting's copy in localStorage, else the system (src/lib/theme.ts). -->
    <script>
      (function () {
        var t = 'system';
        try { t = localStorage.getItem('bateson:theme') || t; } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').content = '#141414';
      })();
    </script>
    <!-- The queue is asked for now, while the app's script is still on its way and starting, not once it has
         started: the question in front of you is on screen that much sooner (src/App.tsx takes it from here). -->
    <script>
      try {
        window.__batesonState = fetch('/api/state').then(function (res) {
          return res.text().then(function (text) { return { ok: res.ok, status: res.status, text: text, told: Number(res.headers.get('x-bateson-told') || NaN) }; });
        });
        window.__batesonState.catch(function () {});
      } catch (e) {}
    </script>
    <title>bateson</title>
    <!-- Installable as an app of its own (in Edge or Chrome: Install), with its own window and taskbar icon. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/fonts/schibstedgrotesk-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/newsreader-normal.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The favicon: bateson's mark in pixels on the highlighter, the same as on bateson.app. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
