<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FCFCFB" />
    <!-- Light or dark before the first paint: the setting's copy in localStorage, else the system (src/lib/theme.ts). -->
    <script>
      (function () {
        var t = 'system';
        try { t = localStorage.getItem('bateson:theme') || t; } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').content = '#141414';
      })();
    </script>
    <title>bateson</title>
    <!-- Installable as an app of its own (in Edge or Chrome: Install), with its own window and taskbar icon. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/fonts/schibstedgrotesk-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/newsreader-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cstyle%3Ecircle%7Bcolor:%231E2126%7D@media(prefers-color-scheme:dark)%7Bcircle%7Bcolor:%23E8E3DA%7D%7D%3C/style%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='currentColor' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='5' fill='currentColor'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
