# The tests on each system bateson runs on. On Windows also the installer, end to end.
name: test
on:
  push:
  pull_request:

# The workflows only read the code: the token they get can do nothing else.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  windows-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: install, with the server at login, into a scratch home
        shell: pwsh
        run: |
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP 'home'
          New-Item -ItemType Directory -Force "$env:USERPROFILE\.claude" | Out-Null
          node scripts/install.ts --login
          if ($LASTEXITCODE) { exit 1 }
          # The server answers.
          $ok = $false
          foreach ($i in 1..30) { try { Invoke-WebRequest http://localhost:4848/api/health -UseBasicParsing | Out-Null; $ok = $true; break } catch { Start-Sleep 1 } }
          if (-not $ok) { Get-Content "$env:USERPROFILE\.bateson\server.log" -ErrorAction SilentlyContinue; throw 'the server did not start' }
          # The login item, the skills and the hooks are in place.
          (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run').bateson
          Get-Item "$env:USERPROFILE\.claude\skills\bateson\SKILL.md" | Out-Null
          if (-not (Select-String -Path "$env:USERPROFILE\.claude\settings.json" -Pattern 'rewake.ts' -Quiet)) { throw 'no hooks' }
          # The command runs from cmd and from Git Bash.
          & "$env:USERPROFILE\.local\bin\bateson.cmd" list
          if ($LASTEXITCODE) { throw 'bateson.cmd failed' }
          & 'C:\Program Files\Git\bin\bash.exe' -c "'$($env:USERPROFILE -replace '\\','/')/.local/bin/bateson' list"
          if ($LASTEXITCODE) { throw 'the Git Bash command failed' }
          # A hook, run as Claude Code runs it: the command from settings.json, through Git Bash.
          $command = (Get-Content "$env:USERPROFILE\.claude\settings.json" -Raw | ConvertFrom-Json).hooks.Stop[0].hooks[0].command
          $env:CLAUDECODE = '1'
          '{"hook_event_name":"Stop","session_id":"ci","cwd":"."}' | & 'C:\Program Files\Git\bin\bash.exe' -c $command
          if ($LASTEXITCODE) { throw "the Stop hook failed: $command" }
          if (-not (Test-Path "$env:USERPROFILE\.bateson\sessions\ci.json")) { Get-Content "$env:USERPROFILE\.bateson\hooks.log" -ErrorAction SilentlyContinue; throw 'the Stop hook did nothing' }
          Remove-Item Env:CLAUDECODE
      - name: a send through Git Bash finds the Claude Code process above it
        shell: pwsh
        run: |
          # This PowerShell stands in for Claude Code: listed as running session ci-walk, two processes above the CLI.
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP 'home'
          New-Item -ItemType Directory -Force "$env:USERPROFILE\.claude\sessions" | Out-Null
          "{`"pid`":$PID,`"sessionId`":`"ci-walk`",`"status`":`"busy`"}" | Set-Content "$env:USERPROFILE\.claude\sessions\$PID.json"
          $env:CLAUDECODE = '1'
          $t = [Diagnostics.Stopwatch]::StartNew()
          $out = 'body' | & 'C:\Program Files\Git\bin\bash.exe' -c "'$($env:USERPROFILE -replace '\\','/')/.local/bin/bateson' send --title Walk --note n --stdin"
          "took $($t.ElapsedMilliseconds) ms"
          Remove-Item Env:CLAUDECODE
          $id = [regex]::Match(($out -join "`n"), 'queued (q_[a-z0-9]+)').Groups[1].Value
          if (-not $id) { $out; throw 'nothing was sent' }
          $session = Get-Content "$env:USERPROFILE\.bateson\items\$id\session.json" -Raw | ConvertFrom-Json
          if ($session.sessionId -ne 'ci-walk') { throw "tied to $($session.sessionId), not ci-walk" }
      - name: uninstall
        shell: pwsh
        run: |
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP 'home'
          node scripts/install.ts --uninstall
          if ($LASTEXITCODE) { exit 1 }
          Start-Sleep 2
          try { Invoke-WebRequest http://localhost:4848/api/health -UseBasicParsing | Out-Null; throw 'the server is still running' } catch [System.Net.WebException], [System.Net.Http.HttpRequestException] { }
          if (Test-Path "$env:USERPROFILE\.local\bin\bateson.cmd") { throw 'the command is still there' }
          if (Test-Path "$env:USERPROFILE\.claude\skills\bateson") { throw 'the skill is still there' }
          if ((Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run').bateson) { throw 'the login item is still there' }
